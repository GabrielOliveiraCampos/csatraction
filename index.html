<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSAT Traction | Sellfy Group</title>
<style>
  :root{
    --laranja:#FE4F18;--laranja-esc:#D9430F;--tinta:#0C0F12;--cinza:#6B625C;--borda:#EADFD9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#F1F1EC;color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:40px 18px 60px}
  .head{text-align:center;margin-bottom:28px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.13em;
    font-size:11px;text-transform:uppercase;color:var(--laranja)}
  .head h1{font-size:24px;margin-top:10px;font-weight:800}
  .head p{color:var(--cinza);margin-top:8px;font-size:14.5px}
  .lista{display:grid;gap:12px}
  a.item{display:flex;align-items:center;justify-content:space-between;background:#fff;
    border:1.5px solid var(--borda);border-radius:14px;padding:16px 18px;text-decoration:none;
    color:var(--tinta);font-weight:700;font-size:15.5px;transition:.15s}
  a.item:hover{border-color:var(--laranja);transform:translateY(-1px)}
  a.item span.arrow{color:var(--laranja);font-weight:800}
  .foot{text-align:center;padding-top:28px;font-size:11px;color:var(--cinza)}
  .foot b{color:var(--laranja)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">Sellfy Group · Traction</div>
    <h1>CSAT Semanal — Traction</h1>
    <p>Selecione a semana correspondente para registrar a avaliação.</p>
  </div>
  <div class="lista">
    <a class="item" href="/semana-1/">Semana 1 <span class="arrow">→</span></a>
    <a class="item" href="/semana-2/">Semana 2 <span class="arrow">→</span></a>
    <a class="item" href="/semana-3/">Semana 3 <span class="arrow">→</span></a>
    <a class="item" href="/semana-4/">Semana 4 <span class="arrow">→</span></a>
    <a class="item" href="/semana-5/">Semana 5 <span class="arrow">→</span></a>
    <a class="item" href="/semana-6/">Semana 6 <span class="arrow">→</span></a>
  </div>
  <div class="foot">Pesquisa oficial <b>Sellfy Group</b> · @sellfygroup</div>
</div>
</body>
</html>
