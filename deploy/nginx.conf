# Nginx do site de avaliações na VPS (Hostinger).
# Copie para /etc/nginx/sites-available/sellfy-avaliacao, troque o server_name
# e ative com: ln -s ../sites-available/sellfy-avaliacao /etc/nginx/sites-enabled/
# O HTTPS (porta 443) é adicionado depois pelo certbot --nginx.

server {
    listen 80;
    server_name avaliacao.sellfygroup.com;

    root /var/www/sellfy-csat;
    index index.html;
    error_page 404 /404.html;

    # Nada deste site deve aparecer no Google
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Arquivos do repositório que não são do site
    location ~ ^/(\.git|\.github|backend|deploy|README\.md) { return 404; }

    location = / { return 302 /admin; }

    # Painel: usuário e senha (arquivo criado com htpasswd, veja o README)
    location ~ ^/admin(/|$) {
        auth_basic "Painel Sellfy";
        auth_basic_user_file /etc/nginx/.htpasswd-sellfy;
        rewrite ^/admin/(scale|icv|traction|journey)/?$ /admin/produto.html break;
        try_files $uri $uri.html $uri/ =404;
    }

    # Link do cliente: /avaliacao/<produto>/<pesquisa> abre sempre o mesmo formulário
    location ~ ^/avaliacao/[^/]+/[^/]+/?$ {
        try_files /avaliacao.html =404;
    }

    # Lista de pesquisas: sempre a versão mais nova
    location = /assets/pesquisas.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
