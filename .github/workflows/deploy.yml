# A cada push na main, copia o site para a VPS (Hostinger) via SSH.
# Segredos em GitHub → Settings → Secrets and variables → Actions:
#   VPS_HOST     IP da VPS
#   VPS_USER     usuário SSH (ex.: root)
#   VPS_SSH_KEY  chave privada que tem acesso à VPS
name: Deploy na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enviar arquivos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude backend --exclude deploy \
            --exclude README.md --exclude .gitignore --exclude .gitattributes \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/sellfy-csat/"
